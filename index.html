<!DOCTYPE html>
<html>
  <head>
    <title>Insane Chess</title>
  </head>
  <body>
    <link rel="stylesheet" href="chessboard/css/chessboard-1.0.0.css"></style>
    <link rel="icon" href="chessboard\img\chesspieces\wikipedia\wN.png" type="image/x-icon">
    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script src="chessboard/js/chessboard-1.0.0.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js" integrity="sha384-s3XgLpvmHyscVpijnseAmye819Ee3yaGa8NxstkJVyA6nuDFjt59u1QvuEl/mecz" crossorigin="anonymous"></script>
    <div id="myBoard" style="width: 300px"></div>
    <label>Status:</label>
    <div id="status"></div>
    <label>FEN:</label> 
    <div id="fen"></div>
    <label>PGN:</label> 
    <div id="pgn"></div>
    <button id="startBtn" onclick="resetGame()">Start Position</button>
    <button id="clearBtn" onclick="clearGame()">Clear Board</button>
    <button id="flipBtn" onclick="flipGame()">Flip Board</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
    <script defer src="/server/server.js"></script>
  </body>
</html>
